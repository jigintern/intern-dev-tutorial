<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 420" width="1168" height="420"
     font-family="Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">

  <!-- 書く言語を3つ並べただけの図。中黒でつないだ1行の文字だけだったのを
       箱にした。文字だけだと上下に大きな余白が残って見出しが中途半端な
       高さに落ちるうえ、3つが並列だということも中黒しか手がかりがなかった。

       箱は3つとも同じ大きさ。ここでは優劣も順序もなく、
       ただ3つあることだけを見せたい。

       色はつけていない。HTML と CSS は画面だけ、JavaScript は画面と処理の
       両方で使うので、3色（画面・処理・保存）のどれかを当てると嘘になる。
       JavaScript の扱いは note と次ページの表が受け持つ。

       箱の下に「骨組み／見た目／動き」を書く形も試したが外した。
       次ページの「画面 は、この3つでつくる」がその説明そのものなので、
       ここで出すと次のページがただの繰り返しになる。
       ここは名前を3つ渡すだけ -->

  <rect x="0" y="0" width="1168" height="420" fill="#ffffff"/>

  <rect x="24" y="120" width="360" height="180" fill="#f7f6f3" stroke="#8f8b82" stroke-width="3"/>
  <text x="204" y="228" text-anchor="middle" font-size="56" font-weight="bold" fill="#1c2126">HTML</text>

  <rect x="404" y="120" width="360" height="180" fill="#f7f6f3" stroke="#8f8b82" stroke-width="3"/>
  <text x="584" y="228" text-anchor="middle" font-size="56" font-weight="bold" fill="#1c2126">CSS</text>

  <rect x="784" y="120" width="360" height="180" fill="#f7f6f3" stroke="#8f8b82" stroke-width="3"/>
  <text x="964" y="228" text-anchor="middle" font-size="56" font-weight="bold" fill="#1c2126">JavaScript</text>

</svg>
