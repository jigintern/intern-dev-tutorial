<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 540" width="1168" height="540"
     font-family="Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">

  <!-- 今日の全部を1枚に収めた図。あとから見返したときにここだけ見れば済むようにする。

       20枚目（fig-two-places）をそのまま下敷きにしている。
       枠の横位置、箱の横位置、処理と保存のあいだの矢印、
       枠外のラベルの位置まで同じ。第2章で見た形がそのまま戻ってくるので、
       「あのページのつづき」として読める。

       20枚目からの違いは3つだけ。
         ・箱の中に言語を足した（役割の下に小さく）
         ・枠のラベルの下に、動かしている環境を足した
         ・枠外のラベルが 見える/見えない から 現場での呼び方 に変わる

       箱の中は 役割（50px）＋言語（34px）の2行。
       1行に横並びにすると「HTML・CSS・JavaScript」が入らず、
       左右で組み方を変えることになる。2行なら3つとも同じ形にできる。

       余白は実測してそろえてある。
         ラベル群の下124 → 箱1の上150      26px
         箱2の下432     → 枠の下端458      26px
         箱1の下260 → 箱2の上322          62px（20枚目と同じ）
         そのあいだの矢印 268-314          上下とも8px
         枠の下端458 → 枠外ラベル488       30px
         図の上余白20 ／ 下余白20

       左も箱に入れてある。右と同じ形になり、枠の中で上下も均等になる。
       言語は2行に分けてある。1行だと 408px あって枠の内側との余白が
       左右 27px まで詰まり、枠線に接して見えた。

       矢印は枠の中央（230）。20枚目と同じ高さなので、
       めくったときに同じところに来る -->

  <rect x="0" y="0" width="1168" height="540" fill="#ffffff"/>

  <!-- ============ 左：手元 ============ -->
  <!-- 枠は場所（手元）を囲むものなので黒。サーバーの枠とそろえてある。
       中の「画面」の箱だけが青 -->
  <rect x="24" y="20" width="470" height="438" fill="#ffffff" stroke="#1c2126" stroke-width="3"/>
  <text x="259" y="78" text-anchor="middle" font-size="44" font-weight="bold" fill="#1c2126">クライアント</text>
  <text x="259" y="118" text-anchor="middle" font-size="32" fill="#5c6570">ブラウザが動かす</text>

  <!-- 左にも箱を置いてある。右と同じ「箱に入った役割＋言語」の形になり、
       枠の中で上下も均等になる。

       文字だけを置いていた時期は、どこに寄せても収まらなかった。
       上下を均等にすると右の箱より下に見え、右の箱と上端をそろえると
       枠の中で上に寄って見える。箱にすれば、箱そのものを
       枠の中央に置けるので両方が解ける。

       箱 210-372（中心291）。右の箱2つ（150-432）の中心とも一致する。
       枠の中の上下は 86px ずつ。
       高さが右（110）と違う（162）のは行数の差。3行と2行なので合わない -->
  <rect x="62" y="210" width="394" height="162" fill="#ffffff" stroke="#17558f" stroke-width="3"/>
  <text x="259" y="264" text-anchor="middle" font-size="50" font-weight="bold" fill="#17558f">画面</text>
  <text x="259" y="309" text-anchor="middle" font-size="34" fill="#5c6570">HTML・CSS</text>
  <text x="259" y="351" text-anchor="middle" font-size="34" fill="#5c6570">JavaScript</text>

  <text x="259" y="520" text-anchor="middle" font-size="40" font-weight="bold" fill="#5c6570">フロントエンド</text>

  <!-- ============ 中央：やりとり ============
       20枚目は「送る／返す」の2本だが、ここは双方向の1本。
       まとめで向きの内訳まで出すと、肝心の対応表が薄まる。
       高さは枠の中央 230。20枚目の矢印も枠の中央に置いてあるので、
       めくったときに同じところに来る。
       横は矢先を含めて 520〜604、中心 562。枠のあいだの中央と一致する -->
  <line x1="524" y1="239" x2="600" y2="239" stroke="#5c6570" stroke-width="5"/>
  <polygon points="520,239 540,229 540,249" fill="#5c6570"/>
  <polygon points="604,239 584,229 584,249" fill="#5c6570"/>

  <!-- ============ 右：サーバー ============ -->
  <rect x="630" y="20" width="514" height="438" fill="#f2f1ed" stroke="#1c2126" stroke-width="3"/>
  <text x="887" y="78" text-anchor="middle" font-size="44" font-weight="bold" fill="#1c2126">サーバー</text>
  <text x="887" y="118" text-anchor="middle" font-size="32" fill="#5c6570">Deno が動かす</text>

  <rect x="668" y="150" width="438" height="110" fill="#ffffff" stroke="#b8501e" stroke-width="3"/>
  <text x="887" y="207" text-anchor="middle" font-size="50" font-weight="bold" fill="#b8501e">処理</text>
  <text x="887" y="243" text-anchor="middle" font-size="34" fill="#5c6570">JavaScript</text>

  <!-- 処理と保存のやりとり。20枚目と同じ位置 -->
  <line x1="887" y1="282" x2="887" y2="300" stroke="#5c6570" stroke-width="4"/>
  <polygon points="887,268 878,286 896,286" fill="#5c6570"/>
  <polygon points="887,314 878,296 896,296" fill="#5c6570"/>

  <rect x="668" y="322" width="438" height="110" fill="#ffffff" stroke="#2c6b4f" stroke-width="3"/>
  <text x="887" y="379" text-anchor="middle" font-size="50" font-weight="bold" fill="#2c6b4f">保存</text>
  <text x="887" y="415" text-anchor="middle" font-size="34" fill="#5c6570">Deno KV</text>

  <text x="887" y="520" text-anchor="middle" font-size="40" font-weight="bold" fill="#5c6570">バックエンド</text>

</svg>
