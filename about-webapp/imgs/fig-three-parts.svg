<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 560" width="1168" height="560"
     font-family="Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">

  <!-- 3つの役割の初出。文字だけだと「画面・処理・保存」が頭に残らないので
       絵をひとつずつ付けた。以降のページはこの3色をそのまま使う。
       このページは note を置かないので、箱を縦に大きくして縦を埋めている。

       枠のあいだに矢印は置かない。ここは3つの名前を覚えてもらうページで、
       つながりは次の「2つの場所」、そのあとの YouTube の例で扱う。
       1枚に2つのことを載せないほうが名前が残る。
       処理の「動かす」が何をしているのか分からない点も、
       21枚目の「ポテト作る」で意味が確定する -->

  <rect x="0" y="0" width="1168" height="560" fill="#ffffff"/>

  <!-- ================= 画面 ================= -->
  <rect x="24" y="10" width="364" height="540" fill="#ffffff" stroke="#17558f" stroke-width="3"/>

  <rect x="106" y="127" width="200" height="150" fill="#ffffff" stroke="#17558f" stroke-width="3"/>
  <rect x="106" y="127" width="200" height="28" fill="#eef3f8"/>
  <line x1="106" y1="155" x2="306" y2="155" stroke="#17558f" stroke-width="2"/>
  <rect x="124" y="172" width="164" height="40" fill="#cfdced"/>
  <rect x="124" y="228" width="164" height="8" fill="#17558f"/>
  <rect x="124" y="248" width="112" height="8" fill="#17558f"/>

  <text x="206" y="375" text-anchor="middle" font-size="52" font-weight="bold" fill="#17558f">画面</text>
  <text x="206" y="434" text-anchor="middle" font-size="40" fill="#5c6570">見せる</text>

  <!-- ================= 処理 ================= -->
  <rect x="402" y="10" width="364" height="540" fill="#ffffff" stroke="#b8501e" stroke-width="3"/>

  <g fill="#ffffff" stroke="#b8501e" stroke-width="3">
    <rect x="570" y="124" width="28" height="28" transform="rotate(0 584 202)"/>
    <rect x="570" y="124" width="28" height="28" transform="rotate(45 584 202)"/>
    <rect x="570" y="124" width="28" height="28" transform="rotate(90 584 202)"/>
    <rect x="570" y="124" width="28" height="28" transform="rotate(135 584 202)"/>
    <rect x="570" y="124" width="28" height="28" transform="rotate(180 584 202)"/>
    <rect x="570" y="124" width="28" height="28" transform="rotate(225 584 202)"/>
    <rect x="570" y="124" width="28" height="28" transform="rotate(270 584 202)"/>
    <rect x="570" y="124" width="28" height="28" transform="rotate(315 584 202)"/>
  </g>
  <circle cx="584" cy="202" r="54" fill="#ffffff" stroke="#b8501e" stroke-width="3"/>
  <circle cx="584" cy="202" r="20" fill="#ffffff" stroke="#b8501e" stroke-width="3"/>

  <text x="584" y="375" text-anchor="middle" font-size="52" font-weight="bold" fill="#b8501e">処理</text>
  <text x="584" y="434" text-anchor="middle" font-size="40" fill="#5c6570">動かす</text>

  <!-- ================= データ ================= -->
  <rect x="780" y="10" width="364" height="540" fill="#ffffff" stroke="#2c6b4f" stroke-width="3"/>

  <path d="M890,150 L890,254 A72,23 0 0 0 1034,254 L1034,150"
        fill="#ffffff" stroke="#2c6b4f" stroke-width="3"/>
  <ellipse cx="962" cy="150" rx="72" ry="23" fill="#ffffff" stroke="#2c6b4f" stroke-width="3"/>
  <path d="M890,190 A72,23 0 0 0 1034,190" fill="none" stroke="#2c6b4f" stroke-width="2"/>
  <path d="M890,222 A72,23 0 0 0 1034,222" fill="none" stroke="#2c6b4f" stroke-width="2"/>

  <text x="962" y="375" text-anchor="middle" font-size="52" font-weight="bold" fill="#2c6b4f">保存</text>
  <text x="962" y="434" text-anchor="middle" font-size="40" fill="#5c6570">覚える</text>

</svg>
