<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 530" width="1168" height="530"
     font-family="Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">

  <!-- このページの主題は「どこにあるか」だけ。役割の説明（見せる／動かす／
       覚える）は18枚目で済んでいるので、ここでは名前だけを置いている。
       説明を並べると1枚に情報が2種類入り、肝心の「どこにあるか」が薄まる。

       次ページのマクドナルドと同じ構造・同じ横位置で描いてある。
       めくると中身だけが入れ替わる。カウンターが画面、キッチンが処理と保存。
       処理と保存のあいだの矢印も、次ページの「材料」と同じ位置にある。
       これがないと、次ページで矢印が3本になったときに対応が取れない。

       枠の外のラベル（ユーザーから見える場所／見えない）はここが先。
       次ページでは主語が お客さん に入れ替わる。

       箱のなかの文字は中央。次ページは アイコン＋動作＋役割名 の3要素を
       並べるので左寄せだが、こちらは1語だけなので中央のほうが落ち着く。

       枠は場所（クライアント／サーバー）なので黒、
       中の箱は役割（画面／処理／保存）なので3色。
       クライアント＝画面なので枠を青にする形も考えられるが、
       それだと場所の枠と役割の枠が同じ色になって区別がつかない -->

  <rect x="0" y="0" width="1168" height="530" fill="#ffffff"/>

  <!-- note を置かないページなので図の高さは 530。
       中身の座標は変えず、g でまとめて下げて縦中央に置いている -->
  <g transform="translate(0,50)">

  <!-- ============ 左：手元のブラウザ ============ -->
  <!-- 枠は場所（手元）を囲むものなので黒。右のサーバーの枠とそろえてある。
       3色（画面・処理・保存）は役割に当てる色なので、場所の枠には使わない -->
  <rect x="24" y="20" width="470" height="320" fill="#ffffff" stroke="#1c2126" stroke-width="3"/>
  <text x="259" y="78" text-anchor="middle" font-size="44" font-weight="bold" fill="#1c2126">クライアント</text>
  <!-- 画面も箱に入れる。右の処理・保存と同じ形にしないと、
       同じ3つの役割なのに1つだけ扱いが違って見える。
       枠からの余白は右と同じ38px。箱の中心は右の箱2つの中心 213 -->
  <rect x="62" y="175" width="394" height="76" fill="#ffffff" stroke="#17558f" stroke-width="3"/>
  <text x="259" y="229" text-anchor="middle" font-size="52" font-weight="bold" fill="#17558f">画面</text>

  <text x="259" y="406" text-anchor="middle" font-size="40" font-weight="bold" fill="#1c2126">ユーザーから見える場所</text>

  <!-- ============ 中央：行きと帰り ============
       次ページ（開く／おすすめ）と同じ形にそろえてある。
       双方向の1本にすると、行きと帰りがあることが読み取れない。
       矢先を含めた全体が上下とも 520〜604 の同じ範囲になるようにしてある -->
  <!-- 縦：ラベルと線を合わせた 111〜249 の中心が 180。枠の中央と一致する。
       前は 72〜210 で中心141、枠の中央より 39px 上にあった。
       横：右向きも左向きも 520〜604。矢先のぶんを足しても中心が 562 でそろう。
       前は矢先を線の外に足していたので、右向きが 10px 右、
       左向きが 4px 左にずれていた -->
  <text x="562" y="143" text-anchor="middle" font-size="40" fill="#5c6570">送る</text>
  <line x1="520" y1="169" x2="590" y2="169" stroke="#5c6570" stroke-width="5"/>
  <polygon points="604,169 586,159 586,179" fill="#5c6570"/>

  <text x="562" y="223" text-anchor="middle" font-size="40" fill="#5c6570">返す</text>
  <line x1="534" y1="249" x2="604" y2="249" stroke="#5c6570" stroke-width="5"/>
  <polygon points="520,249 538,239 538,259" fill="#5c6570"/>

  <!-- ============ 右：サーバー（中に2つ入っている） ============ -->
  <rect x="630" y="20" width="514" height="320" fill="#f2f1ed" stroke="#1c2126" stroke-width="3"/>
  <text x="887" y="78" text-anchor="middle" font-size="44" font-weight="bold" fill="#1c2126">サーバー</text>

  <rect x="668" y="106" width="438" height="76" fill="#ffffff" stroke="#b8501e" stroke-width="3"/>
  <text x="887" y="160" text-anchor="middle" font-size="52" font-weight="bold" fill="#b8501e">処理</text>

  <!-- 処理と保存のやりとり。次ページの「材料」と同じ位置 -->
  <line x1="887" y1="204" x2="887" y2="222" stroke="#5c6570" stroke-width="4"/>
  <polygon points="887,190 878,208 896,208" fill="#5c6570"/>
  <polygon points="887,236 878,218 896,218" fill="#5c6570"/>

  <rect x="668" y="244" width="438" height="76" fill="#ffffff" stroke="#2c6b4f" stroke-width="3"/>
  <text x="887" y="298" text-anchor="middle" font-size="52" font-weight="bold" fill="#2c6b4f">保存</text>

  <text x="887" y="406" text-anchor="middle" font-size="40" font-weight="bold" fill="#1c2126">ユーザーから見えない</text>

  </g>
</svg>
