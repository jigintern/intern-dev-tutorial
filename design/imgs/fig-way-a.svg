<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" font-family="system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <!-- 仕様の4行をそのままメニューにした画面。
       スマホに機能ボタンが4つ並ぶトップ画面は現実にないが、
       業務システムのメニュー画面はこの形が実際に多い。
       だからPCの管理画面として描いてある -->

  <!-- ウィンドウ -->
  <rect x="20" y="20" width="520" height="360" rx="10" fill="#ffffff" stroke="#33b1dd" stroke-width="3" />
  <path d="M20 30 a10 10 0 0 1 10 -10 h500 a10 10 0 0 1 10 10 v44 h-520 z" fill="#33b1dd" />
  <text x="280" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">備品貸出システム</text>

  <text x="280" y="104" text-anchor="middle" font-size="22" fill="#6b7078">メニューを選んでください</text>

  <!-- 一覧（仕様の1行目） -->
  <rect x="50" y="124" width="220" height="94" rx="8" fill="#f1f2f4" stroke="#d3d6db" stroke-width="2" />
  <text x="160" y="180" text-anchor="middle" font-size="26" fill="#202228">一覧</text>

  <!-- 備品情報（仕様の2行目） -->
  <rect x="290" y="124" width="220" height="94" rx="8" fill="#f1f2f4" stroke="#d3d6db" stroke-width="2" />
  <text x="400" y="180" text-anchor="middle" font-size="26" fill="#202228">備品情報</text>

  <!-- 貸出（仕様の3行目） -->
  <rect x="50" y="238" width="220" height="94" rx="8" fill="#f1f2f4" stroke="#d3d6db" stroke-width="2" />
  <text x="160" y="294" text-anchor="middle" font-size="26" fill="#202228">貸出</text>

  <!-- 返却（仕様の4行目） -->
  <rect x="290" y="238" width="220" height="94" rx="8" fill="#f1f2f4" stroke="#d3d6db" stroke-width="2" />
  <text x="400" y="294" text-anchor="middle" font-size="26" fill="#202228">返却</text>
</svg>
