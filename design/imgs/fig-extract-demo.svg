<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" font-family="system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <!-- 仕様の4行に、名詞は下線・動詞は点線の囲みをつけたところ。
       「備品」が4回出てくるが全部同じ備品なので、まとめると1つになる -->

  <!-- 動詞の囲み（文字より先に描く） -->
  <rect x="306" y="39" width="100" height="52" rx="26" fill="none" stroke="#6b7078" stroke-width="3" stroke-dasharray="6 4" />
  <rect x="490" y="134" width="100" height="52" rx="26" fill="none" stroke="#6b7078" stroke-width="3" stroke-dasharray="6 4" />
  <rect x="218" y="229" width="144" height="52" rx="26" fill="none" stroke="#6b7078" stroke-width="3" stroke-dasharray="6 4" />
  <rect x="350" y="324" width="100" height="52" rx="26" fill="none" stroke="#6b7078" stroke-width="3" stroke-dasharray="6 4" />

  <!-- 備品の一覧を見る -->
  <text x="40" y="80" font-size="44" fill="#202228">備品</text>
  <text x="132" y="80" font-size="44" fill="#202228">の一覧を</text>
  <text x="312" y="80" font-size="44" fill="#202228">見る</text>
  <line x1="40" y1="94" x2="128" y2="94" stroke="#33b1dd" stroke-width="5" />

  <!-- 備品の名前と数を見る -->
  <text x="40" y="175" font-size="44" fill="#202228">備品</text>
  <text x="132" y="175" font-size="44" fill="#202228">の</text>
  <text x="180" y="175" font-size="44" fill="#202228">名前</text>
  <text x="272" y="175" font-size="44" fill="#202228">と</text>
  <text x="320" y="175" font-size="44" fill="#202228">数</text>
  <text x="368" y="175" font-size="44" fill="#202228">を</text>
  <text x="496" y="175" font-size="44" fill="#202228">見る</text>
  <line x1="40" y1="189" x2="128" y2="189" stroke="#33b1dd" stroke-width="5" />
  <line x1="180" y1="189" x2="268" y2="189" stroke="#33b1dd" stroke-width="5" />
  <line x1="320" y1="189" x2="364" y2="189" stroke="#33b1dd" stroke-width="5" />

  <!-- 備品を借りる -->
  <text x="40" y="270" font-size="44" fill="#202228">備品</text>
  <text x="132" y="270" font-size="44" fill="#202228">を</text>
  <text x="224" y="270" font-size="44" fill="#202228">借りる</text>
  <line x1="40" y1="284" x2="128" y2="284" stroke="#33b1dd" stroke-width="5" />

  <!-- 借りた備品を返す -->
  <text x="40" y="365" font-size="44" fill="#202228">借りた</text>
  <text x="172" y="365" font-size="44" fill="#202228">備品</text>
  <text x="264" y="365" font-size="44" fill="#202228">を</text>
  <text x="356" y="365" font-size="44" fill="#202228">返す</text>
  <line x1="172" y1="379" x2="260" y2="379" stroke="#33b1dd" stroke-width="5" />
</svg>
