  <text x="145" y="304" text-anchor="middle" font-size="26" fill="#e0574a">どれが仲間か分からない</text>

  <line x1="284" y1="140" x2="336" y2="140" stroke="#33b1dd" stroke-width="4" marker-end="url(#po-arrow)" />

  <!-- ひとかたまり＋余白 -->
  <rect x="370" y="20" width="210" height="250" rx="14" fill="#ffffff" stroke="#33b1dd" stroke-width="3" />
  <rect x="370" y="20" width="210" height="34" rx="14" fill="#f1f2f4" />
