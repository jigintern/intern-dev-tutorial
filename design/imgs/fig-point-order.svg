  <rect x="386" y="70" width="178" height="72" rx="8" fill="#f7fbfd" stroke="#33b1dd" stroke-width="2" stroke-dasharray="7 5" />
  <text x="400" y="96" font-size="15" fill="#202228">アイスコーヒー</text>
  <text x="400" y="126" font-size="19" font-weight="700" fill="#202228">￥500</text>

  <rect x="386" y="156" width="178" height="46" rx="8" fill="#f7fbfd" stroke="#33b1dd" stroke-width="2" stroke-dasharray="7 5" />
