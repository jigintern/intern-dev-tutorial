<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 300" width="1020" height="300" font-family="system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="itf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7078" />
    </marker>
  </defs>

  <!-- ユーザー -->
  <circle cx="130" cy="100" r="38" fill="#9aa1ab" />
  <path d="M82 210 Q82 148 130 148 Q178 148 178 210 z" fill="#9aa1ab" />
  <text x="130" y="262" text-anchor="middle" font-size="32" fill="#202228">ユーザー</text>

  <line x1="215" y1="150" x2="375" y2="150" stroke="#6b7078" stroke-width="3" stroke-dasharray="9 6" marker-start="url(#itf-arrow)" marker-end="url(#itf-arrow)" />

  <!-- UI -->
  <rect x="390" y="55" width="200" height="190" rx="12" fill="#33b1dd" />
  <text x="490" y="168" text-anchor="middle" font-size="60" font-weight="700" fill="#ffffff">UI</text>

  <line x1="605" y1="150" x2="765" y2="150" stroke="#6b7078" stroke-width="3" stroke-dasharray="9 6" marker-start="url(#itf-arrow)" marker-end="url(#itf-arrow)" />

  <!-- サービス: アプリだけではないので、複数ならべる -->
  <rect x="790" y="78" width="120" height="86" rx="6" fill="#ffffff" stroke="#6b7078" stroke-width="3" />
  <rect x="800" y="88" width="100" height="66" fill="#f1f2f4" />
  <path d="M836 164 L831 186 L869 186 L864 164 z" fill="#ffffff" stroke="#6b7078" stroke-width="3" />
  <rect x="818" y="186" width="64" height="8" rx="4" fill="#6b7078" />

  <rect x="925" y="100" width="56" height="98" rx="9" fill="#ffffff" stroke="#6b7078" stroke-width="3" />
  <rect x="933" y="112" width="40" height="66" fill="#f1f2f4" />
  <circle cx="953" cy="188" r="4" fill="#9aa1ab" />

  <text x="880" y="262" text-anchor="middle" font-size="32" fill="#202228">サービス</text>
</svg>
