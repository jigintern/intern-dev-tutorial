<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" font-family="system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <!-- 一覧のならべ方の型。リスト・グリッド・マッピングの3つ。
       今日の備品貸出はリストが素直 -->

  <!-- リスト -->
  <rect x="20" y="20" width="190" height="230" rx="8" fill="#ffffff" stroke="#33b1dd" stroke-width="3" />
  <rect x="36" y="38" width="158" height="40" rx="5" fill="#f1f2f4" stroke="#d3d6db" stroke-width="2" />
  <rect x="36" y="86" width="158" height="40" rx="5" fill="#f1f2f4" stroke="#d3d6db" stroke-width="2" />
  <rect x="36" y="134" width="158" height="40" rx="5" fill="#f1f2f4" stroke="#d3d6db" stroke-width="2" />
  <rect x="36" y="182" width="158" height="40" rx="5" fill="#f1f2f4" stroke="#d3d6db" stroke-width="2" />
  <text x="115" y="292" text-anchor="middle" font-size="32" font-weight="700" fill="#1c8fb5">リスト</text>
  <text x="115" y="326" text-anchor="middle" font-size="24" fill="#6b7078">上から下に並べる</text>

  <!-- グリッド -->
  <rect x="255" y="20" width="190" height="230" rx="8" fill="#ffffff" stroke="#9aa1ab" stroke-width="2" />
  <rect x="271" y="38" width="72" height="72" rx="5" fill="#f1f2f4" stroke="#d3d6db" stroke-width="2" />
  <rect x="357" y="38" width="72" height="72" rx="5" fill="#f1f2f4" stroke="#d3d6db" stroke-width="2" />
  <rect x="271" y="124" width="72" height="72" rx="5" fill="#f1f2f4" stroke="#d3d6db" stroke-width="2" />
  <rect x="357" y="124" width="72" height="72" rx="5" fill="#f1f2f4" stroke="#d3d6db" stroke-width="2" />
  <text x="350" y="292" text-anchor="middle" font-size="32" fill="#6b7078">グリッド</text>
  <text x="350" y="326" text-anchor="middle" font-size="24" fill="#6b7078">格子状に並べる</text>

  <!-- マッピング -->
  <rect x="490" y="20" width="190" height="230" rx="8" fill="#ffffff" stroke="#9aa1ab" stroke-width="2" />
  <path d="M506 200 q40 -60 80 -30 q40 30 78 -20" fill="none" stroke="#e3e6ea" stroke-width="3" />
  <path d="M506 130 q50 40 90 -10 q40 -50 84 -10" fill="none" stroke="#e3e6ea" stroke-width="3" />
  <circle cx="548" cy="88" r="13" fill="#c9ced6" />
  <circle cx="612" cy="152" r="13" fill="#c9ced6" />
  <circle cx="540" cy="192" r="13" fill="#c9ced6" />
  <text x="585" y="292" text-anchor="middle" font-size="32" fill="#6b7078">マッピング</text>
  <text x="585" y="326" text-anchor="middle" font-size="24" fill="#6b7078">地図の上に置く</text>
</svg>
