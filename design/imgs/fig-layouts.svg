    <rect x="22" y="72" width="40" height="40" rx="8" fill="#e6e8ec" />
    <rect x="76" y="76" width="140" height="13" rx="6" fill="#c9ced6" />
    <rect x="76" y="97" width="90" height="11" rx="5" fill="#e6e8ec" />
    <rect x="22" y="132" width="40" height="40" rx="8" fill="#e6e8ec" />
    <rect x="76" y="136" width="160" height="13" rx="6" fill="#c9ced6" />
    <rect x="76" y="157" width="70" height="11" rx="5" fill="#e6e8ec" />
    <rect x="22" y="192" width="40" height="40" rx="8" fill="#e6e8ec" />
    <rect x="76" y="196" width="120" height="13" rx="6" fill="#c9ced6" />
    <rect x="76" y="217" width="100" height="11" rx="5" fill="#e6e8ec" />
    <rect x="22" y="252" width="40" height="40" rx="8" fill="#e6e8ec" />
    <rect x="76" y="256" width="150" height="13" rx="6" fill="#c9ced6" />
    <rect x="76" y="277" width="84" height="11" rx="5" fill="#e6e8ec" />

    <line x1="0" y1="296" x2="280" y2="296" stroke="#e6e8ec" stroke-width="2" />
    <circle cx="70" cy="318" r="13" fill="#33b1dd" />
    <circle cx="140" cy="318" r="13" fill="#e6e8ec" />
    <circle cx="210" cy="318" r="13" fill="#e6e8ec" />
