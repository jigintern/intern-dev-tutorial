<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" width="1120" height="430" font-family="system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <!-- そろっている位置を示す補助線 -->
  <line x1="140" y1="54" x2="1100" y2="54" stroke="#e6e8ec" stroke-width="2" stroke-dasharray="8 6" />
  <line x1="140" y1="342" x2="1100" y2="342" stroke="#e6e8ec" stroke-width="2" stroke-dasharray="8 6" />
  <text x="128" y="62" text-anchor="end" font-size="32" fill="#6b7078">見出し</text>
  <text x="128" y="350" text-anchor="end" font-size="32" fill="#6b7078">メニュー</text>

  <!-- 一覧型 -->
  <g transform="translate(150,30)">
    <rect x="0" y="0" width="280" height="340" rx="16" fill="#ffffff" stroke="#9aa1ab" stroke-width="3" />
    <rect x="0" y="0" width="280" height="48" rx="16" fill="#f1f2f4" />
    <rect x="0" y="32" width="280" height="16" fill="#f1f2f4" />
