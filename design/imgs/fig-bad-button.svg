<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 400" width="1020" height="400" font-family="system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <!-- 使う人の困りごと -->
  <rect x="8" y="56" width="304" height="70" rx="12" fill="#fdecea" stroke="#e0574a" stroke-width="3" />
  <text x="160" y="103" text-anchor="middle" font-size="28" fill="#e0574a">どこから注文するの？</text>
  <line x1="147" y1="126" x2="173" y2="126" stroke="#fdecea" stroke-width="5" />
  <path d="M147 126 L157 150 L173 126" fill="#fdecea" stroke="#e0574a" stroke-width="3" stroke-linejoin="round" />
  <circle cx="160" cy="196" r="32" fill="#9aa1ab" />
  <path d="M120 288 Q120 238 160 238 Q200 238 200 288 z" fill="#9aa1ab" />

  <!-- カフェの注文画面（注文ボタンが見つからない） -->
  <rect x="360" y="20" width="300" height="360" rx="18" fill="#ffffff" stroke="#9aa1ab" stroke-width="3" />
  <rect x="360" y="20" width="300" height="40" rx="18" fill="#f1f2f4" />
  <rect x="360" y="42" width="300" height="18" fill="#f1f2f4" />
  <text x="378" y="46" font-size="11" fill="#9aa1ab">ホーム ＞ メニュー ＞ ドリンク ＞ 詳細</text>

  <rect x="382" y="76" width="256" height="88" rx="6" fill="#e6e8ec" />

  <!-- 商品名の横に、小さなカートアイコン（これが注文ボタン） -->
  <text x="382" y="192" font-size="14" fill="#202228">アイスコーヒー　￥500</text>
  <g transform="translate(556,178)" fill="none" stroke="#c9ced6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 1 L4 1 L8 13 L21 13 L25 4 L6 4" />
    <circle cx="10" cy="18" r="2.4" fill="#c9ced6" stroke="none" />
    <circle cx="19" cy="18" r="2.4" fill="#c9ced6" stroke="none" />
  </g>

  <text x="382" y="216" font-size="11" fill="#6b7078">中深煎りの豆をハンドドリップで一杯ずつ抽出しています。</text>
  <text x="382" y="234" font-size="11" fill="#6b7078">ミルク・ガムシロップは無料でお付けできます。</text>

  <!-- 目立つのに、注文ではないボタン -->
  <rect x="382" y="254" width="256" height="44" rx="10" fill="#33b1dd" />
  <text x="510" y="282" text-anchor="middle" font-size="18" fill="#ffffff">お気に入りに追加</text>

  <line x1="382" y1="316" x2="638" y2="316" stroke="#e6e8ec" stroke-width="2" />
  <text x="382" y="336" font-size="11" fill="#c9ced6">利用規約　よくある質問　お問い合わせ　ヘルプ</text>
  <text x="382" y="356" font-size="11" fill="#c9ced6">会員登録　ポイントについて　店舗一覧　アレルギー表示</text>

  <!-- 注釈 -->
  <rect x="550" y="172" width="42" height="34" rx="6" fill="none" stroke="#e0574a" stroke-width="3" />
  <line x1="592" y1="182" x2="694" y2="182" stroke="#e0574a" stroke-width="3" />
  <text x="702" y="172" font-size="28" fill="#e0574a">注文できるのは</text>
  <text x="702" y="210" font-size="28" fill="#e0574a">この小さなカートだけ</text>
  <text x="702" y="286" font-size="26" fill="#9aa1ab">大きいボタンは</text>
  <text x="702" y="320" font-size="26" fill="#9aa1ab">お気に入り登録</text>
</svg>
