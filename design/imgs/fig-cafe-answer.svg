<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <!-- 入れるもの -->
  <text x="20" y="52" font-size="26" font-weight="700" fill="#202228">入れるもの</text>
  <g stroke="#33b1dd" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 96 L32 106 L48 88" />
    <path d="M22 140 L32 150 L48 132" />
    <path d="M22 184 L32 194 L48 176" />
    <path d="M22 228 L32 238 L48 220" />
    <path d="M22 272 L32 282 L48 264" />
    <path d="M22 316 L32 326 L48 308" />
    <path d="M22 360 L32 370 L48 352" />
  </g>
  <text x="64" y="106" font-size="24" fill="#202228">商品の画像</text>
  <text x="64" y="150" font-size="24" fill="#202228">商品名</text>
  <text x="64" y="194" font-size="24" fill="#202228">商品の説明</text>
  <text x="64" y="238" font-size="24" fill="#202228">値段</text>
  <text x="64" y="282" font-size="24" fill="#202228">個数</text>
  <text x="64" y="326" font-size="24" fill="#202228">お気に入り登録</text>
  <text x="64" y="370" font-size="24" fill="#202228">注文ボタン</text>

  <!-- 正解の注文画面 -->
  <rect x="330" y="20" width="300" height="360" rx="18" fill="#ffffff" stroke="#33b1dd" stroke-width="3" />
  <rect x="330" y="20" width="300" height="50" rx="18" fill="#f1f2f4" />
  <rect x="330" y="46" width="300" height="24" fill="#f1f2f4" />
  <text x="354" y="57" font-size="22" font-weight="700" fill="#202228">カフェ　注文</text>

  <rect x="354" y="90" width="252" height="96" rx="8" fill="#e6e8ec" />

  <text x="354" y="222" font-size="26" fill="#202228">アイスコーヒー</text>
  <!-- お気に入りは、星アイコンで小さく -->
  <path d="M592 209 L595.6 217.4 L604.5 218.2 L597.8 224.1 L599.8 232.8 L592 228.2 L584.2 232.8 L586.2 224.1 L579.5 218.2 L588.4 217.4 Z" fill="none" stroke="#9aa1ab" stroke-width="2.5" stroke-linejoin="round" />
  <text x="354" y="248" font-size="15" fill="#6b7078">すっきり飲みやすい中深煎り</text>
  <text x="354" y="288" font-size="32" font-weight="700" fill="#202228">￥500</text>

  <text x="354" y="322" font-size="15" fill="#6b7078">個数</text>
  <rect x="404" y="304" width="30" height="28" rx="6" fill="#ffffff" stroke="#c9ced6" stroke-width="2" />
  <text x="419" y="324" text-anchor="middle" font-size="16" fill="#6b7078">−</text>
  <text x="452" y="325" text-anchor="middle" font-size="18" fill="#202228">1</text>
  <rect x="470" y="304" width="30" height="28" rx="6" fill="#ffffff" stroke="#c9ced6" stroke-width="2" />
  <text x="485" y="324" text-anchor="middle" font-size="16" fill="#6b7078">＋</text>

  <rect x="354" y="342" width="252" height="26" rx="8" fill="#33b1dd" />
  <text x="480" y="361" text-anchor="middle" font-size="16" fill="#ffffff">注文する</text>

  <!-- ここがポイント -->
  <text x="660" y="52" font-size="26" font-weight="700" fill="#202228">ここがポイント</text>
  <circle cx="674" cy="106" r="15" fill="#33b1dd" />
  <text x="674" y="114" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text>
  <text x="702" y="115" font-size="24" fill="#202228">押すボタンは大きく</text>
  <circle cx="674" cy="182" r="15" fill="#33b1dd" />
  <text x="674" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text>
  <text x="702" y="191" font-size="24" fill="#202228">商品名と値段は大きく</text>
  <circle cx="674" cy="258" r="15" fill="#33b1dd" />
  <text x="674" y="266" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text>
  <text x="702" y="267" font-size="24" fill="#202228">関係するものはまとめる</text>
  <text x="660" y="336" font-size="22" fill="#1c8fb5">説明は短く、要点だけ</text>
  <text x="660" y="370" font-size="22" fill="#1c8fb5">お気に入りは星で小さく</text>
</svg>
