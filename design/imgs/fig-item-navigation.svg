<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" width="440" height="400" font-family="system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <!-- ビューが2つで、そのあいだを行き来する。これがナビゲーション -->
  <defs>
    <marker id="dish-nav-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#202228" />
    </marker>
  </defs>

  <rect x="20" y="20" width="400" height="110" rx="10" fill="#f1f2f4" stroke="#d3d6db" stroke-width="2" />
  <text x="220" y="70" text-anchor="middle" font-size="34" fill="#202228">備品のコレクション</text>
  <text x="220" y="106" text-anchor="middle" font-size="25" fill="#6b7078">備品が並ぶ一覧</text>

  <line x1="220" y1="145" x2="220" y2="255" stroke="#202228" stroke-width="3" marker-start="url(#dish-nav-arrow)" marker-end="url(#dish-nav-arrow)" />
  <text x="238" y="207" font-size="26" fill="#6b7078">行き来する</text>

  <rect x="20" y="270" width="400" height="110" rx="10" fill="#f1f2f4" stroke="#d3d6db" stroke-width="2" />
  <text x="220" y="320" text-anchor="middle" font-size="34" fill="#202228">備品のシングル</text>
  <text x="220" y="356" text-anchor="middle" font-size="25" fill="#6b7078">名前と数を見る</text>
</svg>
