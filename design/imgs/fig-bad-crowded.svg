<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" width="1080" height="400" font-family="system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="gaze-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e0574a" />
    </marker>
  </defs>

  <!-- 使う人の困りごと -->
  <rect x="10" y="66" width="280" height="70" rx="12" fill="#fdecea" stroke="#e0574a" stroke-width="3" />
  <text x="150" y="113" text-anchor="middle" font-size="28" fill="#e0574a">読む気がなくなる</text>
  <line x1="137" y1="136" x2="163" y2="136" stroke="#fdecea" stroke-width="5" />
  <path d="M137 136 L147 160 L163 136" fill="#fdecea" stroke="#e0574a" stroke-width="3" stroke-linejoin="round" />
  <circle cx="150" cy="206" r="32" fill="#9aa1ab" />
  <path d="M110 298 Q110 248 150 248 Q190 248 190 298 z" fill="#9aa1ab" />

  <!-- 説明文だらけのカフェ注文画面 -->
  <rect x="350" y="20" width="340" height="360" rx="18" fill="#ffffff" stroke="#9aa1ab" stroke-width="3" />
  <rect x="350" y="20" width="340" height="40" rx="18" fill="#f1f2f4" />
  <rect x="350" y="42" width="340" height="18" fill="#f1f2f4" />
  <text x="366" y="46" font-size="11" fill="#9aa1ab">ホーム ＞ メニュー ＞ ドリンク ＞ アイス ＞ 詳細</text>

  <rect x="364" y="70" width="312" height="26" rx="6" fill="#e7f5fb" />
  <text x="520" y="87" text-anchor="middle" font-size="11" fill="#1c8fb5">＼ 今だけ！ 全品10%OFF ／</text>

  <text x="364" y="118" font-size="13" font-weight="700" fill="#202228">アイスコーヒー（Mサイズ）￥500</text>

  <text x="364" y="142" font-size="11" fill="#6b7078">当店自慢のアイスコーヒーは、エチオピア産とブラジル産の豆</text>
  <text x="364" y="160" font-size="11" fill="#6b7078">を独自の配合でブレンドし、専用の焙煎機で中深煎りにじっく</text>
  <text x="364" y="178" font-size="11" fill="#6b7078">り仕上げています。抽出は一杯ずつハンドドリップでおこない、</text>
  <text x="364" y="196" font-size="11" fill="#6b7078">氷が溶けても味が薄くならないよう濃いめに落としています。</text>
  <text x="364" y="214" font-size="11" fill="#6b7078">ミルクとガムシロップは無料でお付けできますので、ご注文の</text>
  <text x="364" y="232" font-size="11" fill="#6b7078">際に店員へお申し付けください。持ち帰り用のカップは環境に</text>
  <text x="364" y="250" font-size="11" fill="#6b7078">配慮した紙製で、フタとストローは別売りとなっております。</text>
  <text x="364" y="268" font-size="11" fill="#6b7078">なお、混雑時はお受け取りまでにお時間をいただく場合がござ</text>
  <text x="364" y="286" font-size="11" fill="#6b7078">います。ポイントカードをお持ちの方は会計時にご提示くださ</text>
  <text x="364" y="304" font-size="11" fill="#6b7078">い。アレルギー表示については各商品ページをご確認ください。</text>

  <text x="364" y="328" font-size="11" fill="#33b1dd">利用規約　よくある質問　お問い合わせ　会員登録　ヘルプ</text>
  <text x="364" y="346" font-size="11" fill="#6b7078">サイズ：S ／ M ／ L　　氷：多め ／ 普通 ／ 少なめ</text>
  <text x="364" y="364" font-size="11" fill="#33b1dd">キャンペーン　新商品　ランキング　お気に入り　設定</text>

  <!-- さまよう視線 -->
  <path d="M380 108 L660 138 L376 186 L656 234 L380 278 L654 330" fill="none" stroke="#e0574a" stroke-width="3" stroke-linejoin="round" marker-end="url(#gaze-arrow)" opacity="0.65" />

  <!-- 注釈 -->
  <text x="750" y="182" font-size="28" fill="#e0574a">説明が長すぎて</text>
  <text x="750" y="226" font-size="28" fill="#e0574a">どこが大事か分からない</text>
</svg>
