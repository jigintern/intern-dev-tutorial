<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330" font-family="system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="pt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#33b1dd" />
    </marker>
  </defs>

  <!-- 読みにくい文字 -->
  <rect x="40" y="20" width="210" height="250" rx="14" fill="#ffffff" stroke="#c9ced6" stroke-width="3" />
  <rect x="40" y="20" width="210" height="38" rx="14" fill="#f1f2f4" />
  <rect x="40" y="40" width="210" height="18" fill="#f1f2f4" />
  <text x="60" y="44" font-size="11" font-weight="700" fill="#c9ced6">カフェ　注文</text>
  <rect x="60" y="74" width="170" height="62" rx="6" fill="#e6e8ec" />
  <text x="60" y="164" font-size="11" fill="#dfe3e8">アイスコーヒー</text>
  <text x="60" y="186" font-size="11" fill="#dfe3e8">￥500</text>
  <rect x="60" y="212" width="170" height="42" rx="10" fill="#e6e8ec" />
  <text x="145" y="238" text-anchor="middle" font-size="12" fill="#dfe3e8">注文する</text>
  <text x="145" y="304" text-anchor="middle" font-size="26" fill="#e0574a">近づかないと読めない</text>

  <line x1="284" y1="140" x2="336" y2="140" stroke="#33b1dd" stroke-width="4" marker-end="url(#pt-arrow)" />

  <!-- 読みやすい文字 -->
  <rect x="370" y="20" width="210" height="250" rx="14" fill="#ffffff" stroke="#33b1dd" stroke-width="3" />
  <rect x="370" y="20" width="210" height="38" rx="14" fill="#f1f2f4" />
  <rect x="370" y="40" width="210" height="18" fill="#f1f2f4" />
  <text x="390" y="46" font-size="17" font-weight="700" fill="#202228">カフェ　注文</text>
  <rect x="390" y="74" width="170" height="62" rx="6" fill="#e6e8ec" />
  <text x="390" y="168" font-size="20" fill="#202228">アイスコーヒー</text>
  <text x="390" y="198" font-size="24" font-weight="700" fill="#202228">￥500</text>
  <rect x="390" y="212" width="170" height="42" rx="10" fill="#33b1dd" />
  <text x="475" y="240" text-anchor="middle" font-size="20" fill="#ffffff">注文する</text>
  <text x="475" y="304" text-anchor="middle" font-size="26" fill="#1c8fb5">パッと見て読める</text>

  <!-- 注釈 -->
  <rect x="622" y="118" width="14" height="14" rx="3" fill="#33b1dd" />
  <text x="656" y="132" font-size="26" fill="#202228">文字サイズは大きめに</text>
  <rect x="622" y="176" width="14" height="14" rx="3" fill="#33b1dd" />
  <text x="656" y="190" font-size="26" fill="#202228">背景と色のメリハリを</text>
</svg>
