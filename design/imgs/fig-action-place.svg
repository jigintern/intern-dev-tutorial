<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" font-family="system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <!-- アクションをどのビューに置くかの原則。
       備品が見えているビューなら、どちらにも置ける。
       仕様にあるアクションは「借りる」「返す」だけなので、
       つくる・けすは描かない（仕様にないものは作らない）。
       行の形は13枚目の一覧と揃えてある -->

  <!-- ===== コレクションビュー ===== -->
  <text x="250" y="60" text-anchor="middle" font-size="32" fill="#6b7078">コレクションビュー</text>
  <rect x="120" y="90" width="260" height="270" rx="10" fill="#ffffff" stroke="#33b1dd" stroke-width="3" />
  <path d="M120 100 a10 10 0 0 1 10 -10 h240 a10 10 0 0 1 10 10 v38 h-260 z" fill="#33b1dd" />
  <text x="250" y="123" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">備品の一覧</text>

  <!-- 1行目: 貸出中 -->
  <rect x="136" y="152" width="228" height="58" rx="7" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" />
  <rect x="146" y="161" width="40" height="40" rx="5" fill="#f1f2f4" stroke="#d3d6db" stroke-width="2" />
  <rect x="156" y="170" width="20" height="14" rx="1" fill="none" stroke="#6b7078" stroke-width="2" />
  <path d="M151 192 h30 l-3 -4 h-24 z" fill="none" stroke="#6b7078" stroke-width="2" stroke-linejoin="round" />
  <rect x="196" y="176" width="60" height="10" rx="5" fill="#c9ced6" />
  <rect x="268" y="167" width="82" height="28" rx="14" fill="#ffffff" stroke="#33b1dd" stroke-width="2" />
  <text x="309" y="186" text-anchor="middle" font-size="17" font-weight="700" fill="#1c8fb5">返す</text>

  <!-- 2行目 -->
  <rect x="136" y="218" width="228" height="58" rx="7" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" />
  <rect x="146" y="227" width="40" height="40" rx="5" fill="#f1f2f4" stroke="#d3d6db" stroke-width="2" />
  <rect x="159" y="235" width="14" height="24" rx="2" fill="none" stroke="#6b7078" stroke-width="2" />
  <rect x="196" y="242" width="60" height="10" rx="5" fill="#c9ced6" />
  <rect x="268" y="233" width="82" height="28" rx="14" fill="#33b1dd" />
  <text x="309" y="252" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">借りる</text>

  <!-- 3行目 -->
  <rect x="136" y="284" width="228" height="58" rx="7" fill="#ffffff" stroke="#e3e6ea" stroke-width="2" />
  <rect x="146" y="293" width="40" height="40" rx="5" fill="#f1f2f4" stroke="#d3d6db" stroke-width="2" />
  <rect x="158" y="301" width="16" height="24" rx="2" fill="none" stroke="#6b7078" stroke-width="2" />
  <circle cx="166" cy="308" r="2.6" fill="none" stroke="#6b7078" stroke-width="1.6" />
  <rect x="196" y="308" width="60" height="10" rx="5" fill="#c9ced6" />
  <rect x="268" y="299" width="82" height="28" rx="14" fill="#33b1dd" />
  <text x="309" y="318" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">借りる</text>

  <!-- 引き出し: 行ごとにアクションがある -->
  <line x1="370" y1="247" x2="404" y2="247" stroke="#6b7078" stroke-width="2" />
  <text x="410" y="240" font-size="28" fill="#202228">借りる</text>
  <text x="410" y="274" font-size="28" fill="#202228">返す</text>

  <!-- ===== シングルビュー ===== -->
  <text x="790" y="60" text-anchor="middle" font-size="32" fill="#6b7078">シングルビュー</text>
  <rect x="660" y="90" width="260" height="270" rx="10" fill="#ffffff" stroke="#33b1dd" stroke-width="3" />
  <path d="M660 100 a10 10 0 0 1 10 -10 h240 a10 10 0 0 1 10 10 v38 h-260 z" fill="#33b1dd" />
  <text x="790" y="123" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">備品の詳細</text>

  <rect x="690" y="160" width="56" height="56" rx="8" fill="#f1f2f4" stroke="#d3d6db" stroke-width="2" />
  <rect x="704" y="172" width="28" height="20" rx="2" fill="none" stroke="#6b7078" stroke-width="3" />
  <path d="M698 202 h40 l-4 -5 h-32 z" fill="none" stroke="#6b7078" stroke-width="3" stroke-linejoin="round" />
  <rect x="762" y="168" width="120" height="12" rx="6" fill="#c9ced6" />
  <rect x="762" y="194" width="70" height="12" rx="6" fill="#d3d6db" />

  <!-- 詳細にも同じアクションを置ける -->
  <rect x="690" y="288" width="190" height="46" rx="23" fill="#33b1dd" />
  <text x="785" y="319" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">借りる</text>

  <line x1="890" y1="311" x2="930" y2="311" stroke="#6b7078" stroke-width="2" />
  <text x="936" y="321" font-size="28" fill="#202228">借りる</text>

  <!-- ===== 結論 ===== -->
  <text x="520" y="440" text-anchor="middle" font-size="32" font-weight="700" fill="#1c8fb5">どちらも備品が見えているから、どちらにも置ける</text>
</svg>
