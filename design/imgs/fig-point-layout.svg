<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330" font-family="system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="pl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#33b1dd" />
    </marker>
  </defs>

  <!-- 悪い配置 -->
  <rect x="40" y="20" width="210" height="250" rx="14" fill="#ffffff" stroke="#c9ced6" stroke-width="3" />
  <rect x="40" y="20" width="210" height="38" rx="14" fill="#f1f2f4" />
  <rect x="40" y="40" width="210" height="18" fill="#f1f2f4" />
  <rect x="60" y="32" width="76" height="12" rx="6" fill="#c9ced6" />
  <rect x="60" y="74" width="170" height="62" rx="6" fill="#e6e8ec" />
  <rect x="60" y="152" width="120" height="12" rx="6" fill="#c9ced6" />
  <rect x="60" y="176" width="70" height="12" rx="6" fill="#e6e8ec" />
  <rect x="178" y="234" width="54" height="20" rx="4" fill="#f7f8f9" stroke="#d3d6db" stroke-width="1" />
  <text x="205" y="248" text-anchor="middle" font-size="11" fill="#c9ced6">注文</text>
  <text x="145" y="304" text-anchor="middle" font-size="26" fill="#e0574a">探さないと押せない</text>

  <line x1="284" y1="140" x2="336" y2="140" stroke="#33b1dd" stroke-width="4" marker-end="url(#pl-arrow)" />

  <!-- 良い配置 -->
  <rect x="370" y="20" width="210" height="250" rx="14" fill="#ffffff" stroke="#33b1dd" stroke-width="3" />
  <rect x="370" y="20" width="210" height="38" rx="14" fill="#f1f2f4" />
  <rect x="370" y="40" width="210" height="18" fill="#f1f2f4" />
  <rect x="390" y="32" width="76" height="12" rx="6" fill="#c9ced6" />
  <rect x="390" y="74" width="170" height="62" rx="6" fill="#e6e8ec" />
  <rect x="390" y="152" width="120" height="12" rx="6" fill="#c9ced6" />
  <rect x="390" y="176" width="70" height="12" rx="6" fill="#e6e8ec" />
  <rect x="390" y="212" width="170" height="42" rx="10" fill="#33b1dd" />
  <text x="475" y="240" text-anchor="middle" font-size="20" fill="#ffffff">注文する</text>
  <text x="475" y="304" text-anchor="middle" font-size="26" fill="#1c8fb5">見た瞬間に押せる</text>

  <!-- 注釈 -->
  <rect x="622" y="118" width="14" height="14" rx="3" fill="#33b1dd" />
  <text x="656" y="132" font-size="26" fill="#202228">大きく、目立つ場所に</text>
  <rect x="622" y="176" width="14" height="14" rx="3" fill="#33b1dd" />
  <text x="656" y="190" font-size="26" fill="#202228">迷わせる時間をゼロに</text>
</svg>
