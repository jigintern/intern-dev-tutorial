  <rect x="635" y="58" width="230" height="250" rx="14" fill="#9aa1ab" opacity="0.16" />
  <rect x="635" y="58" width="230" height="250" rx="14" fill="none" stroke="#c9ced6" stroke-width="3" />
  <text x="750" y="228" text-anchor="middle" font-size="120" font-weight="700" fill="#e0574a" opacity="0.72">？</text>

  <!-- 迷っている声 -->
  <rect x="596" y="344" width="308" height="64" rx="14" fill="#fdecea" stroke="#e0574a" stroke-width="3" />
  <line x1="737" y1="344" x2="763" y2="344" stroke="#fdecea" stroke-width="5" />
  <path d="M737 344 L750 320 L763 344" fill="#fdecea" stroke="#e0574a" stroke-width="3" stroke-linejoin="round" />
  <text x="750" y="386" text-anchor="middle" font-size="24" fill="#e0574a">どうやって使うんだ…？</text>
</svg>
