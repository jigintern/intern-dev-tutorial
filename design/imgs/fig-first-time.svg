  <text x="147" y="178" font-size="7.5" fill="#6b7078">が薄くならないよう濃いめに落としています。ミルクとガム</text>
  <text x="147" y="190" font-size="7.5" fill="#6b7078">シロップは無料でお付けできますので店員にお申し付けくだ</text>
  <text x="147" y="202" font-size="7.5" fill="#6b7078">さい。持ち帰り用のカップは紙製で、フタは別売りです。</text>
  <text x="147" y="220" font-size="7.5" fill="#33b1dd">利用規約　よくある質問　注文　お問い合わせ　ヘルプ</text>
  <text x="147" y="234" font-size="7.5" fill="#6b7078">サイズ：S ／ M ／ L　氷：多め ／ 普通 ／ 少なめ</text>
  <rect x="147" y="244" width="206" height="22" rx="5" fill="#33b1dd" />
  <text x="250" y="259" text-anchor="middle" font-size="9" fill="#ffffff">お気に入りに追加</text>
  <text x="147" y="284" font-size="7.5" fill="#c9ced6">会員登録　ポイントについて　店舗一覧　ヘルプ</text>

  <!-- どこが何なのか、作り手には全部わかっている -->
  <g fill="#33b1dd">
    <rect x="152" y="340" width="14" height="14" rx="3" />
    <rect x="152" y="374" width="14" height="14" rx="3" />
    <rect x="152" y="408" width="14" height="14" rx="3" />
  </g>
  <text x="182" y="354" font-size="24" fill="#1c8fb5">これが値段</text>
  <text x="182" y="388" font-size="24" fill="#1c8fb5">ここは商品の説明</text>
  <text x="182" y="422" font-size="24" fill="#1c8fb5">ここが注文ボタン</text>

