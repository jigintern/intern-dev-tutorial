<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <defs>
    <filter id="fog" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="2.4" />
    </filter>
  </defs>

  <line x1="500" y1="16" x2="500" y2="424" stroke="#c9ced6" stroke-width="3" stroke-dasharray="10 8" />

