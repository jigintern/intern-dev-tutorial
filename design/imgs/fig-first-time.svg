  <rect x="135" y="58" width="230" height="28" rx="14" fill="#f1f2f4" />
  <rect x="135" y="72" width="230" height="14" fill="#f1f2f4" />
  <text x="147" y="76" font-size="7.5" fill="#9aa1ab">ホーム ＞ メニュー ＞ ドリンク ＞ 詳細</text>
