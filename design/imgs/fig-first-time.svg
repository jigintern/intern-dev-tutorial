    <text x="647" y="154" font-size="7.5" fill="#6b7078">豆を独自の配合でブレンドし、中深煎りに仕上げています。</text>
    <text x="647" y="166" font-size="7.5" fill="#6b7078">抽出は一杯ずつハンドドリップでおこない、氷が溶けても味</text>
    <text x="647" y="178" font-size="7.5" fill="#6b7078">が薄くならないよう濃いめに落としています。ミルクとガム</text>
    <text x="647" y="190" font-size="7.5" fill="#6b7078">シロップは無料でお付けできますので店員にお申し付けくだ</text>
    <text x="647" y="202" font-size="7.5" fill="#6b7078">さい。持ち帰り用のカップは紙製で、フタは別売りです。</text>
    <text x="647" y="220" font-size="7.5" fill="#33b1dd">利用規約　よくある質問　注文　お問い合わせ　ヘルプ</text>
    <text x="647" y="234" font-size="7.5" fill="#6b7078">サイズ：S ／ M ／ L　氷：多め ／ 普通 ／ 少なめ</text>
    <rect x="647" y="244" width="206" height="22" rx="5" fill="#33b1dd" />
    <text x="750" y="259" text-anchor="middle" font-size="9" fill="#ffffff">お気に入りに追加</text>
    <text x="647" y="284" font-size="7.5" fill="#c9ced6">会員登録　ポイントについて　店舗一覧　ヘルプ</text>
