  <text x="250" y="104" text-anchor="middle" font-size="7.5" fill="#1c8fb5">＼ 今だけ！ 全品10%OFF ／</text>
  <text x="147" y="126" font-size="10" fill="#202228">アイスコーヒー　￥500</text>
  <text x="147" y="142" font-size="7.5" fill="#6b7078">当店自慢のアイスコーヒーは、エチオピア産とブラジル産の</text>
  <text x="147" y="154" font-size="7.5" fill="#6b7078">豆を独自の配合でブレンドし、中深煎りに仕上げています。</text>
