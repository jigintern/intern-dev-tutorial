<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" font-family="system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <!-- スケッチブック（新しいページ） -->
  <rect x="40" y="70" width="320" height="250" rx="10" fill="#ffffff" stroke="#9aa1ab" stroke-width="3" />
  <line x1="40" y1="106" x2="360" y2="106" stroke="#e6e8ec" stroke-width="2" />
  <g stroke="#9aa1ab" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M80 58 L80 88" />
    <path d="M130 58 L130 88" />
    <path d="M180 58 L180 88" />
    <path d="M230 58 L230 88" />
    <path d="M280 58 L280 88" />
    <path d="M320 58 L320 88" />
  </g>
  <text x="200" y="200" text-anchor="middle" font-size="26" fill="#c9ced6">新しいページに</text>

  <!-- えんぴつ -->
  <g transform="translate(248,210) rotate(38)">
    <rect x="0" y="0" width="26" height="96" rx="4" fill="#f1f2f4" stroke="#9aa1ab" stroke-width="3" />
    <path d="M0 96 L26 96 L13 124 z" fill="#ffffff" stroke="#9aa1ab" stroke-width="3" stroke-linejoin="round" />
    <path d="M6 116 L20 116 L13 124 z" fill="#6b7078" />
  </g>

  <!-- 制限時間 -->
  <rect x="430" y="36" width="164" height="60" rx="30" fill="#33b1dd" />
  <text x="512" y="78" text-anchor="middle" font-size="32" font-weight="700" fill="#ffffff">3分</text>

  <!-- 画面に入れるもの -->
  <text x="430" y="150" font-size="30" font-weight="700" fill="#202228">画面に入れるもの</text>
  <g fill="#33b1dd">
    <rect x="432" y="184" width="14" height="14" rx="3" />
    <rect x="432" y="234" width="14" height="14" rx="3" />
    <rect x="432" y="284" width="14" height="14" rx="3" />
    <rect x="722" y="184" width="14" height="14" rx="3" />
    <rect x="722" y="234" width="14" height="14" rx="3" />
    <rect x="722" y="284" width="14" height="14" rx="3" />
  </g>
  <text x="466" y="198" font-size="28" fill="#202228">作品のポスター</text>
  <text x="466" y="248" font-size="28" fill="#202228">作品名</text>
  <text x="466" y="298" font-size="28" fill="#202228">上映日時</text>
  <text x="756" y="198" font-size="28" fill="#202228">席の種類</text>
  <text x="756" y="248" font-size="28" fill="#202228">枚数</text>
  <text x="756" y="298" font-size="28" fill="#202228">予約するボタン</text>
</svg>
